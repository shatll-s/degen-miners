# pearl-tw-miner HiveOS custom miner manifest
CUSTOM_NAME=pearl-tw-miner
CUSTOM_VERSION=1.9.0
CUSTOM_BUILD=1

# shown on the dashboard
CUSTOM_ALGO=kawpow

# absolute path so h-config.sh (writes) and h-run.sh (reads) agree regardless of CWD
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/pearl-tw-miner/pearl-tw-miner.conf

CUSTOM_LOG_BASENAME=/var/log/miner/pearl-tw-miner/pearl-tw-miner
